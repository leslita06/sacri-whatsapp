      <stop offset="0" stop-color="#8a6f52"/>
      <stop offset=".6" stop-color="#5c4733"/>
      <stop offset="1" stop-color="#2f241a"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
